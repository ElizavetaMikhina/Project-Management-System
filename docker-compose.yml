version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
    environment:
      - NODE_ENV=development
    command: yarn start

  backend:
    build:
      context: ./server
    ports:
      - '8080:8080'
    environment:
      - GO_ENV=development
    depends_on:
      - frontend
    command: ./main
